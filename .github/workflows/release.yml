name: Prepare draft release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Parse project version
        run: |
          [xml]$project = Get-Content APTTracker.csproj -Raw
          $versions = @($project.SelectNodes('/Project/PropertyGroup/Version'))
          if ($versions.Count -ne 1) { throw 'Expected exactly one project Version.' }
          $version = $versions[0].InnerText.Trim()
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Expected major.minor.patch, got '$version'."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Compare tag and project version
        run: |
          if ($env:RELEASE_TAG -cne "v$env:RELEASE_VERSION") {
            throw "Tag $env:RELEASE_TAG does not match project version $env:RELEASE_VERSION."
          }

      - name: Restore NuGet packages
        run: |
          & .\dev\tools\nuget.exe restore packages.config `
            -PackagesDirectory packages -NonInteractive `
            -Source https://api.nuget.org/v3/index.json

      - name: Build Release
        run: >-
          dotnet build APTTracker.csproj --configuration Release --output artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --draft `
            --title $env:RELEASE_TAG --generate-notes

      - name: Upload the verified DLL
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:RELEASE_TAG artifacts/APTTracker.dll
