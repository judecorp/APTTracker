name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release version
        run: |
          [xml]$project = Get-Content APTTracker.csproj -Raw
          $versions = @($project.SelectNodes('/Project/PropertyGroup/Version'))
          if ($versions.Count -ne 1) { throw 'Expected exactly one project Version.' }
          $version = $versions[0].InnerText.Trim()
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Expected major.minor.patch, got '$version'."
          }
          if ($env:RELEASE_VERSION -cne $version) {
            throw "Input version '$env:RELEASE_VERSION' does not match project version '$version'."
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: |
          & .\dev\tools\nuget.exe restore packages.config `
            -PackagesDirectory packages -NonInteractive `
            -Source https://api.nuget.org/v3/index.json

      - name: Build Release
        run: >-
          dotnet build APTTracker.csproj --configuration Release --output artifacts

      - name: Tag the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs"
          -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:GITHUB_SHA"

      - name: Create draft release with DLL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG artifacts/APTTracker.dll --verify-tag --draft `
            --title $env:RELEASE_TAG --generate-notes
